name: Sync groups + publish
# Designed & Developed by Nivesh Sahayak (https://www.niveshsahayak.in/). All rights reserved: use or redistribution needs written permission and visible credit. See LICENSE.

# Every 15 minutes: read new groups' names from WhatsApp, copy the group list from the Apps Script
# into data/groups.json, then publish to GitHub Pages. Also publishes whenever you edit a file on main.
# The Apps Script starts this job every 15 minutes (kickGitHub); GitHub's own schedule is only a backup,
# because GitHub often skips scheduled runs on small repos.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:          # "Run workflow" button, and the Apps Script's kickGitHub()
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-groups
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.commit.outputs.changed == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read new groups' names and photos from WhatsApp
        # WhatsApp blocks Google's servers, so GitHub reads the details and sends them to the Apps Script
        continue-on-error: true
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          ENRICH_TOKEN: ${{ secrets.ENRICH_TOKEN }}
        run: node scripts/enrich.mjs
      - name: Build data/groups.json
        # if the Apps Script is down, keep the last good list and still publish
        continue-on-error: true
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: node scripts/build-data.mjs
      - name: Commit if changed
        id: commit
        run: |
          git add data/
          if git diff --cached --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: sync groups"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
